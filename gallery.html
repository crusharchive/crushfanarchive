<!-- VİDEOLAR -->

<h2 class="gallery-title">VİDEOLAR</h2>

<div class="gallery-videos">

<div class="gallery-videos">

    <!-- 5.mp4 — 16:9 -->
    <div class="gallery-video-box video-16-9">

        <video class="gallery-video" playsinline preload="metadata">
            <source src="images/gallery/5.mp4" type="video/mp4">
        </video>

        <button class="gallery-play-btn" aria-label="Videoyu oynat">
            ▶
        </button>

    </div>


    <!-- 6.mp4 — 4:5 -->
    <div class="gallery-video-box video-4-5">

        <video class="gallery-video" playsinline preload="metadata">
            <source src="images/gallery/6.mp4" type="video/mp4">
        </video>

        <button class="gallery-play-btn" aria-label="Videoyu oynat">
            ▶
        </button>

    </div>


    <!-- 14.mp4 — 16:9 -->
    <div class="gallery-video-box video-16-9">

        <video class="gallery-video" playsinline preload="metadata">
            <source src="images/gallery/14.mp4" type="video/mp4">
        </video>

        <button class="gallery-play-btn" aria-label="Videoyu oynat">
            ▶
        </button>

    </div>

</div>



    <!-- FOOTER -->
    <footer>
        <p>© 2026 CRUSH Fan Arşivi</p>
    </footer>


<script>
document.querySelectorAll(".gallery-video-box").forEach(box => {

    const video = box.querySelector(".gallery-video");
    const button = box.querySelector(".gallery-play-btn");

    function toggleVideo(){

        if(video.paused){

            video.play();
            box.classList.add("playing");

        }else{

            video.pause();
            box.classList.remove("playing");

        }

    }

    button.addEventListener("click", function(e){
        e.stopPropagation();
        toggleVideo();
    });

    video.addEventListener("click", toggleVideo);

    video.addEventListener("pause", function(){
        box.classList.remove("playing");
    });

    video.addEventListener("play", function(){
        box.classList.add("playing");
    });

    video.addEventListener("ended", function(){
        box.classList.remove("playing");
    });

});


/* SPACE TUŞU */

document.addEventListener("keydown", function(e){

    if(e.code !== "Space") return;

    const active = document.activeElement;

    if(
        active &&
        (
            active.tagName === "INPUT" ||
            active.tagName === "TEXTAREA" ||
            active.tagName === "BUTTON"
        )
    ) return;

    const videos = document.querySelectorAll(".gallery-video");

    if(videos.length === 0) return;

    e.preventDefault();

    let playingVideo = [...videos].find(video => !video.paused);

    if(playingVideo){

        playingVideo.pause();

    }else{

        videos[0].play();

    }

});
</script>

</body>
</html>
